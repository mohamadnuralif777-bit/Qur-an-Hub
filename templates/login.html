{% extends "base.html" %}
{% block title %}Masuk Admin{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Masuk Admin</h1>
  <p class="muted">Masukkan kredensial admin untuk mengelola materi.</p>
  <form method="post" action="{{ url_for('login') }}">
    <label>Nama Pengguna
      <input type="text" name="username" required autofocus>
    </label>
    <label>Kata Sandi
      <input type="password" name="password" required>
    </label>
    <button type="submit" class="btn btn-primary">Masuk</button>
  </form>
</div>
{% endblock %}
